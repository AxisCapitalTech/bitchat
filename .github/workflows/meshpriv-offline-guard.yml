name: MeshPriv — Offline Startup Guard

on:
  pull_request:
  push:
    branches:
      - 'phase2/**'
      - 'feature/meshpriv-*'
      - 'fix/meshpriv-*'

jobs:
  offline-startup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check online startup regressions
        run: python3 scripts/check-meshpriv-offline-bootstrap.py
      - name: Check Claude A1 A3 A4 A8 security regressions
        run: python3 scripts/check-meshpriv-audit-safety.py
